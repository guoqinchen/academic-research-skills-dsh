name: Upstream check

on:
  schedule:
    # Mondays 06:00 UTC (14:00 Asia/Shanghai)
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      ref:
        description: "Upstream ref (tag, branch, or commit); empty = upstream main"
        required: false
        type: string

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"

      # The ref is untrusted workflow input: pass it through the environment
      # (never interpolate `${{ }}` into a script) and validate its shape.
      - name: Resolve upstream ref
        id: ref
        env:
          INPUT_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          REF="${INPUT_REF:-main}"
          case "$REF" in
            *[!A-Za-z0-9._/-]*)
              echo "invalid upstream ref: $REF" >&2
              exit 2
              ;;
          esac
          if [ "${#REF}" -gt 200 ]; then
            echo "invalid upstream ref: too long" >&2
            exit 2
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Checkout upstream
        env:
          REF: ${{ steps.ref.outputs.ref }}
        run: |
          set -euo pipefail
          UP="$RUNNER_TEMP/upstream"
          git init -q "$UP"
          git -C "$UP" remote add origin https://github.com/Imbad0202/academic-research-skills.git
          git -C "$UP" fetch --depth 1 origin "$REF"
          git -C "$UP" checkout -q FETCH_HEAD
          git -C "$UP" rev-parse HEAD

      - name: Compare payload
        id: diff
        run: |
          set +e
          node tools/check-upstream.mjs --upstream "$RUNNER_TEMP/upstream" --json > "$RUNNER_TEMP/report.json" 2>&1
          EXIT=$?
          node tools/check-upstream.mjs --upstream "$RUNNER_TEMP/upstream" > "$RUNNER_TEMP/report.txt" 2>&1
          echo "exit=$EXIT" >> "$GITHUB_OUTPUT"
          {
            echo "### Upstream check: ${{ steps.ref.outputs.ref }}"
            echo
            echo '```'
            cat "$RUNNER_TEMP/report.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: File or update drift issue
        if: steps.diff.outputs.exit == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ steps.ref.outputs.ref }}
        run: |
          set -euo pipefail
          gh label create upstream-drift --color FBCA04 --description "Upstream payload drift" 2>/dev/null || true
          NUMBER="$(gh issue list --label upstream-drift --state open --json number --jq '.[0].number // empty')"
          {
            printf 'Upstream ref: `%s`\n\n' "$REF"
            echo 'The scheduled `check-upstream` comparison found drift against the pinned payload.'
            echo
            echo '```'
            cat "$RUNNER_TEMP/report.txt"
            echo '```'
            echo
            echo 'Follow `UPGRADING.md` to review and bump.'
          } > "$RUNNER_TEMP/issue.md"
          if [ -n "$NUMBER" ]; then
            gh issue comment "$NUMBER" --body-file "$RUNNER_TEMP/issue.md"
          else
            gh issue create --title "Upstream drift: $REF" --body-file "$RUNNER_TEMP/issue.md" --label upstream-drift
          fi

      - name: Close resolved drift issue
        if: steps.diff.outputs.exit == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ steps.ref.outputs.ref }}
        run: |
          set -euo pipefail
          NUMBER="$(gh issue list --label upstream-drift --state open --json number --jq '.[0].number // empty' 2>/dev/null || true)"
          if [ -n "$NUMBER" ]; then
            COMMENT="$(printf 'Resolved: upstream `%s` matches the pinned payload.' "$REF")"
            gh issue close "$NUMBER" --comment "$COMMENT"
          fi

      - name: Fail on checker error
        if: steps.diff.outputs.exit != '0' && steps.diff.outputs.exit != '1'
        run: |
          echo "check-upstream failed with exit ${{ steps.diff.outputs.exit }}"
          exit 1
