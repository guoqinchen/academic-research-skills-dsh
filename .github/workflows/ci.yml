name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install runtime Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-runtime.txt
      - name: Test suite
        run: npm test
      - name: Payload integrity
        run: node tools/check-payload.mjs
      - name: Python wrapper is current
        run: node tools/build-python-wrapper.mjs --check
