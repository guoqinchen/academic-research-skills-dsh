name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      # Actions are pinned to commit SHAs; the `# vN` comment is the human label.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
      - name: Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Install runtime Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-runtime.txt
      - name: Test suite
        run: npm test
      - name: Install verification
        shell: bash
        run: |
          set -o pipefail
          node tools/verify-install.mjs | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Payload integrity
        run: node tools/check-payload.mjs
      - name: Python wrapper is current
        run: node tools/build-python-wrapper.mjs --check
      # The schemas are hand-written; the local subset test always runs, and
      # this step additionally enforces the real DSH validator so a schema
      # regression cannot pass as a silent skip (see ARS_REQUIRE_DSH_TOOLS).
      # Pin to the desktop runtime's own version (runtime.json
      # desktopVersion 0.2.1-rc.3). The npm `latest` tag is stale at
      # 0.0.1-rc.1, so never install this package without an explicit version.
      - name: Install the DSH schema validator (outside the workspace)
        run: npm install --no-save --no-package-lock --prefix "$RUNNER_TEMP/dsh-tools" @deepseek-ai/dsh-tools@0.2.1-rc.3
      - name: Tool schemas against the real DSH validator
        env:
          ARS_REQUIRE_DSH_TOOLS: "1"
          ARS_DSH_TOOLS_MODULE: ${{ runner.temp }}/dsh-tools/node_modules/@deepseek-ai/dsh-tools/lib/index.js
        run: node --test test/e2e.test.mjs
